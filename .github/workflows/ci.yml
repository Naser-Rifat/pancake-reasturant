name: CI

on:
  push:
    branches: [main]
  pull_request:

# The backend now lives in its own repository (the-pancake-club-backend) with
# its own CI, and `backend/` is gitignored here — so this workflow only covers
# the Next.js frontend. Type checking + a production build catch type errors and
# build breaks on every push. (ESLint is not run yet: typescript-eslint has no
# TypeScript 7.0 support, which this project uses; `tsc` is the type gate.)
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://example.com
