[phases.setup]
nixPkgs = ["python312"]

[phases.install]
cmds = ["python3 -m venv --copies /opt/venv", "/opt/venv/bin/pip install -r requirements.txt"]

[start]
cmd = "/opt/venv/bin/python manage.py migrate && /opt/venv/bin/python manage.py collectstatic --noinput && /opt/venv/bin/python manage.py seed_demo && /opt/venv/bin/gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 3 --threads 4 --timeout 60"
